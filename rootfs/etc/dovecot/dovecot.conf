# =============================================================================
# Dovecot - MailCue IMAP / POP3 / LMTP Server
# Single-file configuration for simplicity in a testing tool.
# =============================================================================

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

# --- Protocols ---------------------------------------------------------------
protocols {
  imap = yes
  pop3 = yes
  lmtp = yes
  sieve = yes
}

# --- Listening ---------------------------------------------------------------
listen = *

# --- Logging -----------------------------------------------------------------
log_path = /dev/stderr
info_log_path = /dev/stdout
debug_log_path = /dev/null

# --- Mail location (Maildir format) ------------------------------------------
mail_driver = maildir
mail_path = /var/mail/vhosts/%{user|domain}/%{user|username}
mail_privileged_group = vmail

# --- First valid UID/GID (matches the vmail user) ----------------------------
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000

# --- Namespace with SPECIAL-USE folders (RFC 6154) ----------------------------
namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    auto = subscribe
    special_use = \\Drafts
  }

  mailbox Junk {
    auto = subscribe
    special_use = \\Junk
  }

  mailbox Sent {
    auto = subscribe
    special_use = \\Sent
  }

  mailbox "Sent Messages" {
    special_use = \\Sent
  }

  mailbox "Sent Items" {
    special_use = \\Sent
  }

  mailbox Trash {
    auto = subscribe
    special_use = \\Trash
  }

  mailbox Archive {
    auto = no
    special_use = \\Archive
  }
}

# --- Authentication ----------------------------------------------------------
auth_master_user_separator = *

# passwd-file backend - virtual user authentication.
passdb passwd-file {
  default_password_scheme = SHA512-CRYPT
  passwd_file_path = /etc/dovecot/users
  result_failure = continue
}

# Catch-all passdb: accept any user not in passwd-file.
# TEST MODE ONLY: In production mode, the init script comments out this block.
passdb static {
  fields {
    nopassword = y
  }
}
# End catch-all passdb

# Master user passdb for API impersonation
passdb master-passwd-file {
  driver = passwd-file
  master = yes
  passwd_file_path = /etc/dovecot/master-users
}

userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  fields {
    uid:default = 5000
    gid:default = 5000
    home:default = /var/mail/vhosts/%{user|domain}/%{user|username}
  }
  result_failure = continue
}

# Catch-all fallback userdb: provides uid/gid/home for any user not in passwd-file.
# allow_all_users=yes is passed in args for the static driver.
userdb static {
  fields {
    uid = 5000
    gid = 5000
    home = /var/mail/vhosts/%{user|domain}/%{user|username}
    allow_all_users=yes
  }
}

# --- SSL / TLS ---------------------------------------------------------------
ssl = yes
ssl_server {
  cert_file = /etc/ssl/mailcue/server.crt
  key_file = /etc/ssl/mailcue/server.key
}
ssl_min_protocol = TLSv1.2

# --- Service listeners -------------------------------------------------------
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

# LMTP - receives mail from Postfix
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
  inet_listener lmtp {
    listen = 127.0.0.1
    port = 24
  }
}

# Auth socket for Postfix SASL
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

service auth-worker {
  user = root
}

# --- Protocol settings -------------------------------------------------------
protocol imap {
  mail_max_userip_connections = 20
  imap_idle_notify_interval = 2 mins
}

protocol pop3 {
  mail_max_userip_connections = 10
  pop3_uidl_format = %{uid | hex(8)}%{uidvalidity | hex(8)}
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@mailcue.local
}

# --- Sieve scripts -----------------------------------------------------------
sieve_script default {
  type = default
  name = default
  driver = file
  path = /etc/dovecot/sieve/default.sieve
}

sieve_script before {
  type = before
  driver = file
  path = /etc/dovecot/sieve/before.d/
}

# --- Quota plugin ------------------------------------------------------------
quota "User quota" {
  storage_size = 500M
}
